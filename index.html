<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>코어 합성 계산기</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f2f5f9;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #64748b;
      --line: #d7dee9;
      --red: #dc3f45;
      --blue: #2878d8;
      --green: #2f9d62;
      --accent: #26364a;
      --accent-soft: #e9eef6;
      --warn: #b7791f;
      --danger: #b42318;
      --shadow: 0 14px 36px rgba(31, 41, 51, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(180deg, #eef3f8 0, var(--bg) 260px),
        var(--bg);
      color: var(--text);
    }

    main {
      width: min(1320px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 36px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .sub {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .creator {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .82);
      color: #475569;
      padding: 8px 11px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 18px rgba(31, 41, 51, .05);
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 17px;
      letter-spacing: 0;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-size: 13px;
      color: #334155;
      font-weight: 650;
    }

    input, select, textarea, button {
      font: inherit;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfe;
      color: var(--text);
      padding: 9px 10px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #51627a;
      box-shadow: 0 0 0 3px rgba(81, 98, 122, .16);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: white;
      border-radius: 6px;
      padding: 9px 12px;
      cursor: pointer;
      font-weight: 700;
    }

    button.secondary {
      background: #fff;
      color: var(--accent);
    }

    button.danger {
      background: #fff;
      color: var(--danger);
      border-color: #f2b8b5;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .mode {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .mode button {
      font-size: 12px;
      padding: 8px 6px;
    }

    .direct-levels {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .direct-levels input {
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      padding: 12px 8px;
    }

    .mode button {
      background: #fff;
      color: var(--accent);
      border-color: var(--line);
    }

    .mode button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .checks {
      display: grid;
      gap: 7px;
      margin-top: 10px;
    }

    .core-options {
      display: grid;
      gap: 7px;
      max-height: 280px;
      overflow: auto;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
    }

    .color-filter {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin: 8px 0 10px;
    }

    .color-filter button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 8px;
      border-color: var(--line);
      background: #fff;
      color: #334155;
      font-size: 12px;
      font-weight: 750;
    }

    .color-filter button.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .filter-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: currentColor;
    }

    .filter-dot.red { background: var(--red); }
    .filter-dot.blue { background: var(--blue); }
    .filter-dot.green { background: var(--green); }

    .core-option {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 9px;
      width: 100%;
      padding: 9px;
      border: 1px solid #e1e7ef;
      border-radius: 7px;
      background: #fff;
      color: var(--text);
      text-align: left;
      font-weight: 500;
    }

    .core-option:hover {
      border-color: #b7c3d3;
      background: #fbfcfe;
    }

    .core-option.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(38, 54, 74, .12);
    }

    .core-color {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 24px;
      border-radius: 999px;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
    }

    .core-color.red { background: var(--red); }
    .core-color.blue { background: var(--blue); }
    .core-color.green { background: var(--green); }

    .core-option-title {
      display: block;
      font-size: 13px;
      line-height: 1.25;
    }

    .core-option-detail {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .excluded {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
      min-height: 28px;
    }

    .excluded button {
      border-color: #cbd5e1;
      background: #f8fafc;
      color: #334155;
      padding: 5px 8px;
      font-size: 12px;
      font-weight: 650;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #334155;
      font-size: 13px;
    }

    .check input {
      width: auto;
    }

    .status {
      margin-top: 10px;
      padding: 9px 10px;
      border-radius: 6px;
      background: var(--accent-soft);
      color: #475569;
      font-size: 13px;
      line-height: 1.45;
    }

    .status.warn {
      background: #fff7e6;
      color: var(--warn);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px 12px;
      background: #fff;
      box-shadow: 0 8px 22px rgba(31, 41, 51, .06);
    }

    .stat b {
      display: block;
      font-size: 20px;
      line-height: 1.25;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .toolbar .row {
      width: min(420px, 100%);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: #fff;
    }

    th, td {
      border-bottom: 1px solid #e6ebf2;
      padding: 9px 8px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      position: sticky;
      top: 0;
      background: #eef3f8;
      z-index: 1;
      color: #334155;
      font-size: 12px;
    }

    .table-wrap {
      max-height: calc(100vh - 285px);
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .core {
      display: grid;
      gap: 3px;
      min-width: 180px;
    }

    .material-button {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
      font-weight: inherit;
    }

    .material-button:hover strong {
      text-decoration: underline;
    }

    .core strong {
      font-size: 13px;
      line-height: 1.25;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      border-radius: 999px;
      padding: 2px 8px;
      color: #fff;
      font-size: 12px;
      font-weight: 750;
    }

    .pill.red { background: var(--red); }
    .pill.blue { background: var(--blue); }
    .pill.green { background: var(--green); }

    .empty {
      padding: 38px 16px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .hidden { display: none !important; }

    @media (max-width: 960px) {
      main { width: min(100vw - 20px, 760px); padding-top: 16px; }
      header { display: block; }
      .creator { display: inline-block; margin-top: 12px; }
      .grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr 1fr; }
      .table-wrap { max-height: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>코어 합성 계산기</h1>
        <p class="sub">1~4층 코어와 시트 DB를 합쳐서 목표 레벨, 목표 코어, 또는 재료 3레벨 기준의 합성 결과를 찾습니다. 세 종류가 같지 않으면 합성되므로, 같은 코어 2개 + 다른 코어 1개도 포함합니다.</p>
      </div>
      <div class="creator">제작자 : DuckbaeK</div>
    </header>

    <div class="grid">
      <section class="panel">
        <h2>DB 불러오기</h2>
        <div class="actions">
          <button id="loadScript">DB 새로고침</button>
        </div>
        <div id="loadStatus" class="status">아직 DB를 불러오지 않았습니다.</div>

        <h2 style="margin-top: 18px;">계산 방식</h2>
        <div class="mode">
          <button id="modeDirect" type="button">3레벨 입력</button>
          <button id="modeLevel" class="active" type="button">목표 레벨</button>
          <button id="modeCore" type="button">원하는 코어</button>
        </div>

        <div id="directControls" class="hidden">
          <label for="directPaste">한 번에 붙여넣기</label>
          <input id="directPaste" placeholder="예: 108 110 112" autocomplete="off" />
          <div class="direct-levels" style="margin-top: 10px;">
            <div>
              <label for="directA">재료 1</label>
              <input id="directA" type="number" min="1" max="200" inputmode="numeric" autocomplete="off" />
            </div>
            <div>
              <label for="directB">재료 2</label>
              <input id="directB" type="number" min="1" max="200" inputmode="numeric" autocomplete="off" />
            </div>
            <div>
              <label for="directC">재료 3</label>
              <input id="directC" type="number" min="1" max="200" inputmode="numeric" autocomplete="off" />
            </div>
          </div>
        </div>

        <div id="levelControls">
          <label for="targetLevel">원하는 코어 레벨</label>
          <input id="targetLevel" type="number" min="1" step="1" placeholder="예: 116" />
        </div>

        <div id="coreControls" class="hidden">
          <label for="coreSearch">코어 검색</label>
          <input id="coreSearch" placeholder="몬스터명, 효과, 무기 검색" />
          <div class="color-filter" aria-label="코어 색상 필터">
            <button class="active" type="button" data-color-filter="all"><span class="filter-dot"></span>전체</button>
            <button type="button" data-color-filter="red"><span class="filter-dot red"></span>빨강</button>
            <button type="button" data-color-filter="blue"><span class="filter-dot blue"></span>파랑</button>
            <button type="button" data-color-filter="green"><span class="filter-dot green"></span>초록</button>
          </div>
          <label>원하는 코어</label>
          <div id="targetCoreList" class="core-options"></div>
        </div>

        <h2 style="margin-top: 18px;">필터</h2>
        <div class="checks">
          <label class="check"><input id="excludeTarget" type="checkbox" checked /> 선택한 목표 코어는 재료에서 제외</label>
          <label class="check hidden"><input id="allowSameMonster" type="checkbox" checked /> 같은 몬스터의 다른 색상 코어도 재료로 허용</label>
          <label class="check"><input id="showOnlyComplete" type="checkbox" checked /> 효과 정보가 채워진 코어만 사용</label>
        </div>
        <div class="row">
          <div>
            <label for="minLevel">재료 최소 레벨</label>
            <input id="minLevel" type="number" min="1" step="1" />
          </div>
          <div>
            <label for="maxLevel">재료 최대 레벨</label>
            <input id="maxLevel" type="number" min="1" step="1" />
          </div>
        </div>
        <div class="actions">
          <button id="calculate">조합 찾기</button>
          <button class="secondary" id="resetFilters">필터 초기화</button>
        </div>
        <h2 style="margin-top: 18px;">제외 재료</h2>
        <div id="excludedList" class="excluded"></div>
        <div class="actions">
          <button class="danger" id="clearExcluded">제외 목록 비우기</button>
        </div>
      </section>

      <section>
        <div class="stats">
          <div class="stat"><b id="coreCount">0</b><span>불러온 코어</span></div>
          <div class="stat"><b id="comboCount">0</b><span>가능 조합</span></div>
          <div class="stat"><b id="avgLevel">-</b><span>평균 레벨</span></div>
          <div class="stat"><b id="resultLevel">-</b><span>DB 결과</span></div>
          <div class="stat"><b id="chance">-</b><span>목표 코어 확률</span></div>
        </div>

        <div class="panel">
          <div class="toolbar">
            <h2 style="margin:0;">조합 결과</h2>
            <div class="row">
              <select id="sortBy">
                <option value="balanced">목표 레벨에 가까운 재료 우선</option>
                <option value="low">낮은 레벨 재료 우선</option>
                <option value="high">높은 레벨 재료 우선</option>
              </select>
              <input id="resultSearch" placeholder="결과 내 검색" />
            </div>
          </div>
          <div id="empty" class="empty">DB를 불러온 뒤 원하는 레벨이나 코어를 선택하세요.</div>
          <div id="results" class="table-wrap hidden">
            <table>
              <thead>
                <tr id="resultHead">
                  <th>재료 몬스터 1</th>
                  <th>재료 몬스터 2</th>
                  <th>재료 몬스터 3</th>
                  <th>평균 레벨</th>
                </tr>
              </thead>
              <tbody id="resultBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const state = {
      mode: "level",
      cores: [],
      combos: [],
      directCores: [],
      excludedMonsters: new Set(),
      targetLevel: null,
      targetCore: null,
      selectedCoreId: "",
      coreColorFilter: "all",
      average: null,
      nearestLevels: [],
    };

    const els = {
      loadScript: document.getElementById("loadScript"),
      loadStatus: document.getElementById("loadStatus"),
      modeDirect: document.getElementById("modeDirect"),
      modeLevel: document.getElementById("modeLevel"),
      modeCore: document.getElementById("modeCore"),
      directControls: document.getElementById("directControls"),
      levelControls: document.getElementById("levelControls"),
      coreControls: document.getElementById("coreControls"),
      directPaste: document.getElementById("directPaste"),
      directA: document.getElementById("directA"),
      directB: document.getElementById("directB"),
      directC: document.getElementById("directC"),
      targetLevel: document.getElementById("targetLevel"),
      coreSearch: document.getElementById("coreSearch"),
      colorFilters: Array.from(document.querySelectorAll("[data-color-filter]")),
      targetCoreList: document.getElementById("targetCoreList"),
      excludeTarget: document.getElementById("excludeTarget"),
      allowSameMonster: document.getElementById("allowSameMonster"),
      showOnlyComplete: document.getElementById("showOnlyComplete"),
      minLevel: document.getElementById("minLevel"),
      maxLevel: document.getElementById("maxLevel"),
      calculate: document.getElementById("calculate"),
      resetFilters: document.getElementById("resetFilters"),
      excludedList: document.getElementById("excludedList"),
      clearExcluded: document.getElementById("clearExcluded"),
      sortBy: document.getElementById("sortBy"),
      resultSearch: document.getElementById("resultSearch"),
      coreCount: document.getElementById("coreCount"),
      comboCount: document.getElementById("comboCount"),
      avgLevel: document.getElementById("avgLevel"),
      resultLevel: document.getElementById("resultLevel"),
      chance: document.getElementById("chance"),
      empty: document.getElementById("empty"),
      results: document.getElementById("results"),
      resultHead: document.getElementById("resultHead"),
      resultBody: document.getElementById("resultBody"),
    };

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let quote = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];
        if (quote) {
          if (ch === '"' && next === '"') {
            cell += '"';
            i++;
          } else if (ch === '"') {
            quote = false;
          } else {
            cell += ch;
          }
        } else if (ch === '"') {
          quote = true;
        } else if (ch === ",") {
          row.push(cell);
          cell = "";
        } else if (ch === "\n") {
          row.push(cell);
          rows.push(row);
          row = [];
          cell = "";
        } else if (ch !== "\r") {
          cell += ch;
        }
      }
      row.push(cell);
      if (row.some(value => value.trim() !== "")) rows.push(row);
      return rows;
    }

    function normalizeHeader(value) {
      return String(value || "").trim().replace(/\s+/g, " ");
    }

    function rowValue(row, headers, names) {
      for (const name of names) {
        const index = headers.indexOf(name);
        if (index >= 0) return String(row[index] || "").trim();
      }
      return "";
    }

    function buildCoresFromDbInput(rows) {
      const headers = rows[0].map(normalizeHeader);
      const cores = [];

      rows.slice(1).forEach((row, index) => {
        const rowNo = rowValue(row, headers, ["번호"]) || String(index + 1);
        const floor = rowValue(row, headers, ["층"]) || "5층";
        const level = Number(rowValue(row, headers, ["코어 레벨"]));
        const monster = rowValue(row, headers, ["몬스터명"]);
        const note = rowValue(row, headers, ["비고"]);
        if (!monster || !Number.isFinite(level)) return;

        [
          ["red", "빨강", ["빨강 구분"], ["빨강 효과"], ["빨강 무기", "코어 무기"]],
          ["blue", "파랑", ["파랑 구분"], ["파랑 효과"], ["파랑 무기"]],
          ["green", "초록", ["초록 구분"], ["초록 효과"], ["초록 무기"]],
        ].forEach(([code, color, typeNames, effectNames, weaponNames]) => {
          const effectType = rowValue(row, headers, typeNames);
          const effect = rowValue(row, headers, effectNames);
          const weapon = rowValue(row, headers, weaponNames);
          cores.push({
            id: `${floor}-${String(rowNo).padStart(3, "0")}-${code}`,
            floor,
            level,
            monster,
            color,
            colorCode: code,
            effectType,
            effect,
            weapon,
            note,
          });
        });
      });

      return cores;
    }

    function buildCoresFromObjects(objects) {
      const headers = [
        "번호", "층", "코어 레벨", "몬스터명",
        "빨강 구분", "빨강 효과", "빨강 무기",
        "파랑 구분", "파랑 효과", "파랑 무기",
        "초록 구분", "초록 효과", "초록 무기",
        "비고", "상태"
      ];
      const rows = [
        headers,
        ...objects.map(item => headers.map(header => item[header] || ""))
      ];
      return buildCoresFromDbInput(rows);
    }

    function setStatus(message, warn = false) {
      els.loadStatus.textContent = message;
      els.loadStatus.classList.toggle("warn", warn);
    }

    function uniqueDbLevels() {
      return Array.from(new Set(state.cores.map(core => core.level).filter(level => Number.isFinite(level)))).sort((a, b) => a - b);
    }

    function nearestLevels(avg, levels) {
      if (!levels.length || !Number.isFinite(avg)) return [];
      const EPS = 1e-9;
      let best = Infinity;
      let found = [];
      levels.forEach(level => {
        const distance = Math.abs(avg - level);
        if (distance < best - EPS) {
          best = distance;
          found = [level];
        } else if (Math.abs(distance - best) <= EPS) {
          found.push(level);
        }
      });
      return found.sort((a, b) => a - b);
    }

    function formatResultLevels(levels) {
      if (!levels.length) return "";
      return levels.map(level => `Lv${level}`).join(" 또는 ");
    }

    function parseDirectLevels(text) {
      return (String(text || "").match(/\d+/g) || []).map(Number).filter(n => Number.isFinite(n) && n > 0).slice(0, 3);
    }

    function setMode(mode) {
      state.mode = mode;
      els.modeDirect.classList.toggle("active", mode === "direct");
      els.modeLevel.classList.toggle("active", mode === "level");
      els.modeCore.classList.toggle("active", mode === "core");
      els.directControls.classList.toggle("hidden", mode !== "direct");
      els.levelControls.classList.toggle("hidden", mode !== "level");
      els.coreControls.classList.toggle("hidden", mode !== "core");
      els.calculate.textContent = mode === "direct" ? "결과 보기" : "조합 찾기";
    }

      return `${core.floor} · Lv${core.level} · ${core.effectType || "구분 없음"} · ${core.effect || "효과 없음"}${weapon}`;

        return colorMatched && (!query || text.includes(query));

    function objectsFromGviz(payload) {
      const table = payload && payload.table;
      if (!table || !Array.isArray(table.cols) || !Array.isArray(table.rows)) {
        throw new Error("시트 형식이 올바르지 않습니다.");
      }
      const headers = table.cols.map(col => normalizeHeader(col.label || col.id));
      return table.rows.map(row => {
        const item = {};
        headers.forEach((header, index) => {
          const cell = row.c && row.c[index];
          const value = cell && cell.f != null ? cell.f : cell && cell.v != null ? cell.v : "";
          item[header] = String(value);
        });
        return item;
      });
    }

    function loadSheetTable() {
      return new Promise((resolve, reject) => {
        const callback = `coreSheet_${Date.now()}_${Math.floor(Math.random() * 10000)}`;
        const script = document.createElement("script");
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("시간 초과"));
        }, 15000);
        function cleanup() {
          clearTimeout(timer);
          delete window[callback];
          script.remove();
        }
        window[callback] = payload => {
          cleanup();
          if (!payload || payload.status !== "ok") {
            reject(new Error("시트 응답이 올바르지 않습니다."));
            return;
          }
          resolve(payload);
        };
        script.onerror = () => {
          cleanup();
          reject(new Error("시트를 읽지 못했습니다."));
        };
        script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${callback}&gid=${SHEET_GID}&headers=1&_=${Date.now()}`;
        document.head.appendChild(script);
      });
    }

    function coreObjectKey(item) {
      return `${item["층"]}::${item["몬스터명"]}`;
    }

    function mergeCoreObjects(sheetObjects, extraObjects) {
      const seen = new Set(sheetObjects.map(coreObjectKey));
      const extra = extraObjects.filter(item => !seen.has(coreObjectKey(item)));
      return [...sheetObjects, ...extra];
    }

    async function loadFromScript() {
      setStatus("시트에서 DB를 불러오는 중입니다.");
      let sheetObjects = [];
      let sheetOk = false;
      try {
        const payload = await loadSheetTable();
        sheetObjects = objectsFromGviz(payload);
        sheetOk = sheetObjects.length > 0;
      } catch (error) {
        sheetOk = false;
      }

      const objects = mergeCoreObjects(sheetObjects, EXTRA_CORE_DB);
      const cores = buildCoresFromObjects(objects);
      if (!cores.length) {
        setStatus("시트가 비공개라 DB를 못 읽습니다. 공유에서 '링크가 있는 모든 사용자 · 뷰어'로 바꿔 주세요.", true);
        return;
      }

      const extraCount = new Set(EXTRA_CORE_DB.map(item => coreObjectKey(item))).size;
      applyDb(cores, sheetOk ? "코어 DB + 1~4층" : "1~4층 내장 DB");
      if (!sheetOk) {
        setStatus(`시트는 못 읽었지만 1~4층 코어 ${extraCount}종은 불러왔습니다. 시트를 '링크가 있는 모든 사용자 · 뷰어'로 바꿔 주세요.`, true);
      }
    }

    function availableCores(targetCore) {
      const min = els.minLevel.value.trim() === "" ? null : Number(els.minLevel.value);
      const max = els.maxLevel.value.trim() === "" ? null : Number(els.maxLevel.value);
      return state.cores.filter(core => {
        if (els.showOnlyComplete.checked && (!core.effectType || !core.effect)) return false;
        if (min !== null && Number.isFinite(min) && core.level < min) return false;
        if (max !== null && Number.isFinite(max) && core.level > max) return false;
        if (targetCore && els.excludeTarget.checked && core.id === targetCore.id) return false;
        if (state.excludedMonsters.has(`${core.floor}::${core.monster}`)) return false;
        return true;
      });
    }

    function availableMonsters(targetCore) {
      const seen = new Map();
      availableCores(targetCore).forEach(core => {
        const key = `${core.floor}::${core.monster}`;
        if (!seen.has(key)) {
          seen.set(key, {
            id: key,
            floor: core.floor,
            monster: core.monster,
            level: core.level,
            cores: [],
          });
        }
        seen.get(key).cores.push(core);
      });
      return Array.from(seen.values());
    }

    function runCalculate() {
      if (state.mode === "direct") findDirect();
      else findCombos();
    }

    function findDirect() {
      if (!state.cores.length) {
        state.average = null;
        clearResults("먼저 DB를 불러오세요.");
        return;
      }

      const values = [els.directA.value, els.directB.value, els.directC.value].map(Number);
      if (!values.every(n => Number.isFinite(n) && n > 0)) {
        state.average = null;
        clearResults("재료 레벨 3개를 입력하세요.");
        return;
      }

      const avg = (values[0] + values[1] + values[2]) / 3;
      const nearest = nearestLevels(avg, uniqueDbLevels());
      const cores = availableCores(null).filter(core => nearest.includes(core.level));
      state.average = avg;
      state.targetLevel = nearest.length === 1 ? nearest[0] : null;
      state.targetCore = null;
      state.nearestLevels = nearest;
      state.combos = [];
      state.directCores = cores;
      els.avgLevel.textContent = avg.toFixed(2);
      els.chance.textContent = "-";
      els.chance.title = "";

      if (!nearest.length || !cores.length) {
        els.comboCount.textContent = "0";
        els.resultLevel.textContent = "없음";
        els.empty.textContent = `평균 ${avg.toFixed(2)} · DB 내 결과가 없습니다.`;
        els.empty.classList.remove("hidden");
        els.results.classList.add("hidden");
        els.resultBody.innerHTML = "";
        return;
      }

      els.comboCount.textContent = cores.length.toLocaleString();
      els.resultLevel.textContent = formatResultLevels(nearest) + (nearest.length > 1 ? " (둘 중 하나)" : "");
      renderDirectResults();
    }

    function renderDirectResults() {
      const query = els.resultSearch.value.trim().toLowerCase();
      const filtered = state.directCores.filter(core => {
        if (!query) return true;
        return [core.monster, core.floor, core.color, core.level, core.effectType, core.effect, core.weapon].join(" ").toLowerCase().includes(query);
      });
      els.resultHead.innerHTML = "<th>몬스터</th><th>색상</th><th>레벨</th><th>효과</th>";
      els.resultBody.innerHTML = "";
      if (!filtered.length) {
        els.empty.textContent = "검색 조건에 맞는 코어가 없습니다.";
        els.empty.classList.remove("hidden");
        els.results.classList.add("hidden");
        return;
      }
      els.resultBody.innerHTML = filtered.map(core => `
        <tr>
          <td><strong>${escapeHtml(core.monster)}</strong><div class="meta">${escapeHtml(core.floor)}</div></td>
          <td><span class="pill ${escapeHtml(core.colorCode)}">${escapeHtml(core.color)}</span></td>
          <td>Lv${core.level}</td>
          <td>${escapeHtml(core.effectType || "구분 없음")} · ${escapeHtml(core.effect || "효과 없음")}${core.weapon ? " · " + escapeHtml(core.weapon) : ""}</td>
        </tr>
      `).join("");
      els.empty.classList.add("hidden");
      els.results.classList.remove("hidden");
    }

    function findCombos() {
      if (!state.cores.length) {
        state.average = null;
        clearResults("먼저 DB를 불러오세요.");
        return;
      }

      let targetCore = null;
      let targetLevel = Number(els.targetLevel.value);
      if (state.mode === "core") {
        targetCore = state.cores.find(core => core.id === state.selectedCoreId) || null;
        if (!targetCore) {
          state.average = null;
          clearResults("원하는 코어를 선택하세요.");
          return;
        }
        targetLevel = targetCore.level;
      }

      if (!Number.isFinite(targetLevel) || targetLevel <= 0) {
        state.average = null;
        clearResults("원하는 레벨을 입력하세요.");
        return;
      }

      const dbLevels = uniqueDbLevels();
      if (!dbLevels.includes(targetLevel)) {
        state.average = null;
        state.targetLevel = targetLevel;
        state.targetCore = targetCore;
        state.nearestLevels = [];
        clearResults("DB 내 결과가 없습니다.");
        els.resultLevel.textContent = "없음";
        return;
      }

      const pool = availableMonsters(targetCore);
      const combos = [];

      function pushIfMatch(a, b, c) {
        const avg = (a.level + b.level + c.level) / 3;
        if (nearestLevels(avg, dbLevels).includes(targetLevel)) combos.push([a, b, c]);
      }

      for (let i = 0; i < pool.length; i++) {
        for (let j = i + 1; j < pool.length; j++) {
          for (let k = j + 1; k < pool.length; k++) {
            pushIfMatch(pool[i], pool[j], pool[k]);
          }
        }
      }

      for (let i = 0; i < pool.length; i++) {
        for (let j = 0; j < pool.length; j++) {
          if (i === j) continue;
          pushIfMatch(pool[i], pool[i], pool[j]);
        }
      }

      state.average = null;
      state.targetLevel = targetLevel;
      state.targetCore = targetCore;
      state.nearestLevels = [targetLevel];
      state.directCores = [];
      state.combos = sortCombos(combos, targetLevel);
      renderSummary();
      renderResults();
    }

    function sortCombos(combos, targetLevel) {
      const score = combo => combo.reduce((total, core) => total + Math.abs(core.level - targetLevel), 0);
      return combos.slice().sort((a, b) => {
        if (els.sortBy.value === "low") return sumLevels(a) - sumLevels(b) || score(a) - score(b);
        if (els.sortBy.value === "high") return sumLevels(b) - sumLevels(a) || score(a) - score(b);
        return score(a) - score(b);
      });
    }

    function sumLevels(combo) {
      return combo.reduce((total, core) => total + core.level, 0);
    }

    function renderSummary() {
      els.comboCount.textContent = state.combos.length.toLocaleString();
      els.avgLevel.textContent = "-";
      els.resultLevel.textContent = state.targetLevel ? `Lv${state.targetLevel}` : "-";
      if (state.targetCore) {
        const colorPool = state.cores.filter(core => core.level === state.targetLevel && core.color === state.targetCore.color);
        if (colorPool.length) {
          const singleRoll = 1 / (3 * colorPool.length);
          const threeChoices = 1 - Math.pow(1 - singleRoll, 3);
          els.chance.textContent = `${(threeChoices * 100).toFixed(2)}%`;
          els.chance.title = `3개 보기 기준. ${state.targetCore.color} Lv${state.targetLevel} 후보 ${colorPool.length}개, 1칸당 ${(singleRoll * 100).toFixed(2)}%`;
        } else {
          els.chance.textContent = "-";
          els.chance.title = "";
        }
      } else {
        els.chance.textContent = "-";
        els.chance.title = "";
      }
    }

    function renderMaterial(material) {
      return `
        <button class="material-button" type="button" data-material-id="${escapeHtml(material.id)}" title="이 몬스터 코어를 조합 결과에서 제외">
          <div class="core">
            <strong>${escapeHtml(material.monster)} 코어</strong>
            <span class="meta">${escapeHtml(material.floor)} · Lv${material.level}</span>
          </div>
        </button>
      `;
    }

    function renderExcludedList() {
      els.excludedList.innerHTML = "";
      if (!state.excludedMonsters.size) {
        els.excludedList.innerHTML = `<span class="meta">조합 결과의 재료를 클릭하면 제외됩니다.</span>`;
        return;
      }

      Array.from(state.excludedMonsters).sort().forEach(id => {
        const monster = id.split("::")[1] || id;
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.excludedId = id;
        button.textContent = `${monster} ×`;
        els.excludedList.appendChild(button);
      });
    }

    function rerunIfReady() {
      renderExcludedList();
      if (state.mode === "direct") {
        if (els.directA.value && els.directB.value && els.directC.value) findDirect();
        return;
      }
      if (state.targetLevel) findCombos();
    }

    function renderResults() {
      if (state.mode === "direct") {
        renderDirectResults();
        return;
      }
      els.resultHead.innerHTML = "<th>재료 몬스터 1</th><th>재료 몬스터 2</th><th>재료 몬스터 3</th><th>평균 레벨</th>";
      const query = els.resultSearch.value.trim().toLowerCase();
      const filtered = state.combos.filter(combo => {
        if (!query) return true;
        return combo.some(material => `${material.monster} ${material.floor} ${material.level}`.toLowerCase().includes(query));
      });

      els.resultBody.innerHTML = "";
      if (!filtered.length) {
        els.empty.textContent = state.combos.length ? "검색 조건에 맞는 조합이 없습니다." : "가능한 조합이 없습니다.";
        els.empty.classList.remove("hidden");
        els.results.classList.add("hidden");
        return;
      }

      const dbLevels = uniqueDbLevels();
      const rows = filtered.slice(0, 1000).map(combo => {
        const avg = sumLevels(combo) / 3;
        const nearest = nearestLevels(avg, dbLevels);
        return `
          <tr>
            <td>${renderMaterial(combo[0])}</td>
            <td>${renderMaterial(combo[1])}</td>
            <td>${renderMaterial(combo[2])}</td>
            <td>Lv${avg.toFixed(2)} → ${formatResultLevels(nearest) || "없음"}</td>
          </tr>
        `;
      }).join("");

      els.resultBody.innerHTML = rows;
      els.empty.classList.add("hidden");
      els.results.classList.remove("hidden");

      if (filtered.length > 1000) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td colspan="4" class="meta">결과가 많아 앞의 1,000개만 표시했습니다. 검색이나 필터를 사용하세요.</td>`;
        els.resultBody.appendChild(tr);
      }
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;",
      }[ch]));
    }

    els.loadScript.addEventListener("click", loadFromScript);
    els.modeDirect.addEventListener("click", () => setMode("direct"));
    els.modeLevel.addEventListener("click", () => setMode("level"));
    els.modeCore.addEventListener("click", () => setMode("core"));
    els.coreSearch.addEventListener("input", renderCoreOptions);
    els.colorFilters.forEach(button => {
      button.addEventListener("click", () => {
        state.coreColorFilter = button.dataset.colorFilter;
        els.colorFilters.forEach(item => item.classList.toggle("active", item === button));
        renderCoreOptions();
      });
    });
    els.targetCoreList.addEventListener("click", event => {
      const button = event.target.closest("[data-core-id]");
      if (!button) return;
      state.selectedCoreId = button.dataset.coreId;
      renderCoreOptions();
    });
    els.calculate.addEventListener("click", runCalculate);
    els.sortBy.addEventListener("change", () => {
      if (state.mode === "direct") {
        renderDirectResults();
        return;
      }
      state.combos = sortCombos(state.combos, state.targetLevel || 0);
      renderResults();
    });
    els.resultSearch.addEventListener("input", renderResults);
    els.resultBody.addEventListener("click", event => {
      const button = event.target.closest("[data-material-id]");
      if (!button) return;
      state.excludedMonsters.add(button.dataset.materialId);
      renderExcludedList();
      runCalculate();
    });
    els.excludedList.addEventListener("click", event => {
      const button = event.target.closest("[data-excluded-id]");
      if (!button) return;
      state.excludedMonsters.delete(button.dataset.excludedId);
      rerunIfReady();
    });
    els.clearExcluded.addEventListener("click", () => {
      state.excludedMonsters.clear();
      rerunIfReady();
    });
    els.resetFilters.addEventListener("click", () => {
      els.excludeTarget.checked = true;
      els.allowSameMonster.checked = true;
      els.showOnlyComplete.checked = true;
      els.minLevel.value = "";
      els.maxLevel.value = "";
    });

    function fillDirectLevels(values) {
      const ids = ["directA", "directB", "directC"];
      ids.forEach((id, i) => {
        els[id].value = values[i] != null ? String(values[i]) : els[id].value;
      });
    }

    els.directPaste.addEventListener("input", () => {
      const parsed = parseDirectLevels(els.directPaste.value);
      if (parsed.length >= 3) {
        fillDirectLevels(parsed);
        els.directPaste.value = parsed.join(" ");
        findDirect();
      }
    });
    ["directA", "directB", "directC"].forEach((id, index) => {
      const input = els[id];
      input.addEventListener("focus", () => input.select());
      input.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " " || event.key === ",") {
          event.preventDefault();
          if (index < 2) {
            els[["directA", "directB", "directC"][index + 1]].focus();
            els[["directA", "directB", "directC"][index + 1]].select();
          } else {
            findDirect();
          }
        }
      });
      input.addEventListener("paste", event => {
        const text = event.clipboardData && event.clipboardData.getData("text");
        const parsed = parseDirectLevels(text || "");
        if (parsed.length >= 2) {
          event.preventDefault();
          const next = [Number(els.directA.value), Number(els.directB.value), Number(els.directC.value)];
          const start = parsed.length >= 3 ? 0 : index;
          parsed.forEach((level, i) => {
            if (start + i < 3) next[start + i] = level;
          });
          fillDirectLevels(next);
          if (next.every(n => Number.isFinite(n) && n > 0)) findDirect();
        }
      });
      input.addEventListener("input", () => {
        if (/^\d{3}$/.test(String(input.value).trim()) && index < 2) {
          els[["directA", "directB", "directC"][index + 1]].focus();
          els[["directA", "directB", "directC"][index + 1]].select();
        }
        if ([els.directA.value, els.directB.value, els.directC.value].every(v => v !== "")) findDirect();
      });
    });

    setMode("level");
    renderExcludedList();
    loadFromScript();
  </script>
</body>
</html>
